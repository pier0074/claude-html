<!doctype html><meta charset="utf-8">
<title>session</title>
<style>/*{{css}}*/</style>
<header><div class="hw">
<h1 class="crumbs" id="crumbs"></h1>
<div class="meta" id="subtitle"></div>

<div class="bar">

<span class="group"><button id="ffirst" title="first match">«</button>

<span id="fc"></span><button id="fnext" title="next match (enter)">›</button>
<button id="flast" title="last match">»</button></span></span>
<span class="nav"><span class="lbl">prompts</span><button id="first" title="first prompt">«</button>
<button id="prev" title="previous prompt (k)">‹</button>
<span id="pc"></span><button id="next" title="next prompt (j)">›</button>
<button id="last" title="last prompt">»</button></span>
<button id="theme" class="th" title="theme">◐</button>
</div>
</div></header>
