<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude sessions</title>
<script src="defaults.js"></script>
<script>(function(){var t=null;try{t=localStorage.getItem("ch-theme")}catch(e){}if(t!=="auto"&&t!=="light"&&t!=="dark")t=(window.CH_DEFAULTS||{}).theme;if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)})()</script>
<style>/*{{css}}*/</style>
<main class="ix">
<h1>Claude sessions <button id="theme" class="th" title="theme" aria-label="theme">◐</button></h1>
<p class="links"><a href="https://claude.ai/" target="_blank" rel="noopener"
title="the Claude web app">claude.ai<span class="ext">↗</span></a>
<span class="sep">·</span>
<a href="https://claude.ai/settings/usage" target="_blank" rel="noopener"
title="your plan's usage and limits, on claude.ai">plan usage<span class="ext">↗</span></a>
<span class="sep">·</span>
<a href="usage.html" title="tokens from your own transcripts, by week, month, model and project">token dashboard</a>
<span class="sep">·</span>
<a href="settings.html" title="every claude-html setting: what it is, where it comes from, and a field to change it">settings</a></p>
<p class="sub"><span id="count">0 sessions</span><span id="built"></span> · rebuild with <code>claude-html</code><span id="launch"></span></p>
<p class="sub upd" id="update" hidden></p>
<p class="sub upd" id="updated" hidden></p>
<div class="errors" id="errors" hidden></div>
<div id="plan" hidden></div>
<div class="searchbox" id="sb"><input id="q" type="search" aria-label="search every conversation" placeholder="search every conversation — words, or &quot;an exact phrase&quot;…" autofocus>
<label class="case" title="match upper and lower case exactly"><input type="checkbox" id="cs"> match case</label></div>
<p class="view" id="view" hidden>group · <button id="gdate">by date</button><button id="gproj">by project</button></p>
<p id="n"></p>
<div class="tw" id="tw"><table id="ix"><thead><tr><th>Date</th><th>Project</th><th>What</th><th class="num">Prompts</th><th class="num">Tokens</th><th class="num" title="as Claude Code recorded it, at API list prices — only recent versions record it">Cost</th><th>Source</th><th>Session</th><th>Resume</th><th></th></tr></thead>
<tbody id="rows"></tbody></table></div>
<p class="none" id="empty" hidden></p>
<h2 id="mh" hidden>Messages</h2>
<div id="mr"></div>
</main>
