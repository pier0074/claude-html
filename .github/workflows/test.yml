# The same suites, on both platforms the tool runs on. macOS answers for the
# osascript engine and the BSD userland, Ubuntu for node and GNU — and the
# backend suite on macOS proves the two engines produce byte-identical pages.
name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash tests/run-all.sh
